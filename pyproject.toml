[project]
name = "archp"
version = "0.1.0"
description = "ARCHP: six-stage pipelined processor tools (assembler, golden model, GHDL runner)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
archp = "archp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "mypy>=1.13",
    "poethepoet>=0.31",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archp"]

# ---------------------------------------------------------------- tasks (ADR-002)
# Run any task with:  uv run poe <task>

[tool.poe.tasks.lint]
help = "Ruff lint + format check"
sequence = [{ cmd = "ruff check ." }, { cmd = "ruff format --check ." }]

[tool.poe.tasks.fmt]
help = "Auto-fix lint issues and format Python code"
sequence = [{ cmd = "ruff check --fix ." }, { cmd = "ruff format ." }]

[tool.poe.tasks.types]
help = "mypy --strict"
cmd = "mypy"

[tool.poe.tasks.test]
help = "Run all tests (Python + GHDL testbenches), in parallel"
cmd = "pytest -n auto"

[tool.poe.tasks.check]
help = "Everything CI runs"
sequence = ["lint", "types", "test"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"tools/gen_schematic.py" = ["E501"]  # coordinate table

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.12"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
